<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14564b" />
    <meta name="description" content="Urji Finance OS - your personal financial operating system. Private and offline: your data stays on this device." />
    <title>Urji Finance OS</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body data-page="dashboard">
    <header class="app-header">
      <div class="app-header__inner">
        <h1 class="app-header__title">Urji Finance</h1>
        <div class="app-header__actions" id="header-actions"></div>
      </div>
    </header>

    <main class="app-main" id="app-main" tabindex="-1">
      <p class="boot-note" role="status">Loading&hellip;</p>
    </main>

    <nav class="app-nav" id="app-nav" aria-label="Primary"></nav>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>

    <noscript>Urji Finance OS needs JavaScript. It runs entirely on this device and sends nothing anywhere.</noscript>
    <script type="module" src="js/ui/pages/dashboard.js"></script>
  </body>
</html>
